<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VIPLAV</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-state="offline">
  <div class="workspace">
  <main class="stage">
    <svg id="face" viewBox="0 0 400 400" aria-label="VIPLAV's face" role="img">
      <defs>
        <radialGradient id="core" cx="50%" cy="45%" r="60%">
          <stop offset="0%" stop-color="var(--core-hi)"/>
          <stop offset="100%" stop-color="var(--core-lo)"/>
        </radialGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g class="rings" filter="url(#glow)">
        <circle id="halo" cx="200" cy="200" r="170" class="ring halo"/>
        <circle cx="200" cy="200" r="150" class="ring orbit" pathLength="100"/>
        <circle cx="200" cy="200" r="138" class="ring orbit inner" pathLength="100"/>
      </g>
      <circle cx="200" cy="200" r="120" fill="url(#core)" class="core"/>
      <g class="features" filter="url(#glow)">
        <g id="eyes">
          <ellipse id="eye-l" cx="160" cy="182" rx="11" ry="15" class="eye"/>
          <ellipse id="eye-r" cx="240" cy="182" rx="11" ry="15" class="eye"/>
        </g>
        <path id="mouth" class="mouth" d="M165 250 Q200 256 235 250"/>
      </g>
    </svg>

    <p id="status" class="status" aria-live="polite">Connecting…</p>
    <p id="caption" class="caption" aria-live="polite"></p>
  </main>

  <section id="board" class="board" aria-label="Thinking board" hidden>
    <header>
      <h2>Board <span id="board-count" class="count"></span></h2>
      <a id="board-download" class="chip" href="/api/board.md" title="Download the board as notes">Download</a>
    </header>
    <p id="board-empty" class="hint">Talk through what's on your mind. VIPLAV files each thread here as you go.</p>
    <div id="board-groups"></div>
  </section>
  </div>

  <section id="log" class="log" aria-label="Conversation" hidden></section>

  <footer class="controls">
    <button id="mic" class="mic" aria-pressed="false" title="Start / stop listening (Space)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      <span id="mic-label">Tap to talk</span>
    </button>
    <form id="typed" class="typed" autocomplete="off">
      <input id="typed-input" placeholder="…or type" aria-label="Type a message">
    </form>
    <div class="toggles">
      <label class="chip select" title="The language you're speaking. Mixed sentences work too.">
        <span class="visually-hidden">Language</span>
        <select id="lang" aria-label="Language you're speaking"></select>
      </label>
      <button id="toggle-board" class="chip" aria-pressed="false" title="Show the threads VIPLAV is keeping track of">Board</button>
      <button id="toggle-log" class="chip" aria-pressed="false" title="Show the conversation as text">Transcript</button>
      <button id="toggle-barge" class="chip" aria-pressed="true" title="Speaking while VIPLAV talks interrupts it. Turn off on speakers if it interrupts itself.">Interrupt by voice</button>
      <button id="reset" class="chip" title="Start a new conversation">New chat</button>
      <a class="chip" href="/record" title="Record sentences to build a Lambadi voice dataset">Record</a>
    </div>
  </footer>

  <script src="/static/mic.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
